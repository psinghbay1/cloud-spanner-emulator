name: Docker

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to build
        required: true
      build_args:
        description: Extra docker build arguments, e.g. "--build-arg BAZEL_JOBS=2"
        required: false
        default: ''

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      # GoogleSQL translation units need several GB each to compile; swap keeps
      # the 7 GB runner from being shut down when a few of them overlap.
      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Docker build
        env:
          BUILD_ARGS: ${{ inputs.build_args }}
        run: |
          set -o pipefail
          docker build --progress=plain $BUILD_ARGS \
            -f build/docker/Dockerfile.ubuntu -t emulator:ci . 2>&1 | tee /tmp/docker-build.log

      - name: Smoke test the image
        run: |
          docker run -d --name emulator -p 9010:9010 -p 9020:9020 emulator:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:9020/v1/projects/test/instances >/dev/null 2>&1; then
              echo "Emulator REST endpoint is up"; docker rm -f emulator; exit 0
            fi
            sleep 2
          done
          docker logs emulator
          exit 1

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: docker-build-log
          path: /tmp/docker-build.log
          retention-days: 7
