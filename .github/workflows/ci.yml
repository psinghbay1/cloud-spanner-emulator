name: CI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to test'
        required: true
        type: string
      targets:
        description: 'Bazel target patterns'
        required: false
        default: '//...'
        type: string

permissions:
  contents: read

jobs:
  bazel-test:
    name: Bazel test
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GCC_VERSION: '13'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      # GoogleSQL translation units need several GB each to compile; on a 7 GB
      # runner, parallel compiles exhaust memory and the runner is shut down.
      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Install toolchain packages
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-${GCC_VERSION} g++-${GCC_VERSION} protobuf-compiler python3 \
            zip unzip make rename
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-${GCC_VERSION} 90 \
            --slave /usr/bin/g++ g++ /usr/bin/g++-${GCC_VERSION}
          sudo update-alternatives --install /usr/bin/cc cc /usr/bin/gcc-${GCC_VERSION} 90
          sudo update-alternatives --install /usr/bin/c++ c++ /usr/bin/g++-${GCC_VERSION} 90
          sudo ln -sf /usr/bin/python3 /usr/local/bin/python
          gcc --version | head -1

      - name: Install bazelisk
        run: |
          sudo curl -fsSL -o /usr/local/bin/bazel \
            https://github.com/bazelbuild/bazelisk/releases/download/v1.25.0/bazelisk-linux-amd64
          sudo chmod +x /usr/local/bin/bazel
          export USE_BAZEL_VERSION="$(tr -d '[:space:]' < .bazelversion)"
          echo "USE_BAZEL_VERSION=$USE_BAZEL_VERSION" >> "$GITHUB_ENV"
          bazel --version

      - name: Cache Bazel disk and repository caches
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion') }}-${{ github.run_id }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion') }}-
            bazel-${{ runner.os }}-

      - name: Bazel test
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          set -o pipefail
          status=0
          bazel test \
            --disk_cache="$HOME/.cache/bazel-disk" \
            --repository_cache="$HOME/.cache/bazel-repo" \
            --test_output=errors --keep_going \
            --jobs=2 --local_resources=memory=HOST_RAM*.6 \
            --test_timeout=300,900,2700,3600 \
            --curses=no --color=no --show_timestamps --verbose_failures \
            -- $TARGETS || status=$?
          # Exit code 4 means the build succeeded but the patterns matched no
          # tests, which is expected for build-only targets.
          if [ "$status" -eq 4 ]; then
            echo "Build succeeded; no test targets matched."
            exit 0
          fi
          exit "$status"

      - name: Collect test logs
        if: failure()
        run: |
          mkdir -p /tmp/testlogs
          cp -rL bazel-testlogs/. /tmp/testlogs/ 2>/dev/null || true

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: bazel-testlogs
          path: /tmp/testlogs
          retention-days: 7
          if-no-files-found: ignore
